<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Ponte da Formação Continuada — Painel Interativo</title>
<link rel="stylesheet" href="./style.css"></head><body><div class="shell"><main class="stage" aria-label="Paisagem de uma ponte entre duas margens"><div class="heading"><div class="brand"><h1>A Ponte da Formação Continuada</h1><p>O que preservar · O que nos conecta · O que transformar</p></div><button class="mini" id="guide">Como explorar ↗</button></div>
<button class="hotspot left" data-area="passado" aria-label="Abrir os campos desbravados"><span class="bubble">↶</span><strong>Campos desbravados</strong><small>Experiências e aprendizados</small></button>
<button class="hotspot middle" data-area="ponte" aria-label="Abrir a ponte da mediação"><span class="bubble">⚖</span><strong>A ponte</strong><small>Mediação e equilíbrio</small></button>
<button class="hotspot right" data-area="futuro" aria-label="Abrir os campos a explorar"><span class="bubble">✧</span><strong>Campos a explorar</strong><small>Próximas possibilidades</small></button>
<div class="bottom">Clique em um dos três pontos da paisagem para iniciar a reflexão.</div></main>
<div class="support"><button id="overview">⌁ Comparar as duas margens</button><button id="consolidate">✍ Síntese coletiva</button><button id="export">↓ Exportar relatório Word (.docx)</button><button id="clear">↺ Limpar meus registros</button></div>
</div><dialog class="dialog" id="panel"><div class="inner"><header><div><h2 id="panelTitle"></h2><p class="sub" id="panelSubtitle"></p></div><button class="close" id="close" aria-label="Fechar">✕</button></header><div class="tabs" id="tabs"></div><div class="present-controls" id="presentControls"><button type="button" id="prevItem" aria-label="Tópico anterior">← Anterior</button><span id="presentCounter" aria-live="polite"></span><button type="button" id="nextItem" aria-label="Próximo tópico">Próximo →</button><button type="button" id="toggleList" title="Alternar apresentação e lista">☷ Ver todos</button><button type="button" id="fullscreenBtn" title="Tela cheia do navegador">⛶ Tela cheia</button></div><section id="panelContent"></section><div class="editor" id="editor"><label for="note">Comentários do Formador</label><textarea id="note" placeholder="Selecione uma frase numerada acima e registre seu comentário..."></textarea><p class="selected-note" id="selectedNote" aria-live="polite"></p><button class="save" id="save">Salvar comentário da frase</button><p class="saved" id="saved"></p></div></div></dialog>
<script src="./script.js" defer></script></body></html>
